name: franchise-api

services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      MONGODB_URI: mongodb://mongo:27017/franchises
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
